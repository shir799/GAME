<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm UI - Cannabis Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b', 950: '#022c22' },
            accent: { 50: '#fffbeb', 500: '#f59e0b', 600: '#d97706', 900: '#78350f' },
            success: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 900: '#14532d' },
            dark: { bg: '#0a0f0a', surface: '#151b15', elevated: '#1f261f', border: '#2a332a' }
          },
          fontFamily: { sans: ['"Inter"', 'sans-serif'], display: ['"Montserrat"', 'sans-serif'] },
          animation: { 'pulse-soft': 'pulseSoft 2s ease-in-out infinite', 'float': 'float 3s ease-in-out infinite', 'bounce-in': 'bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55)' },
          keyframes: {
            pulseSoft: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0.8' } },
            float: { '0%, 100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-10px)' } },
            bounceIn: { '0%': { transform: 'scale(0)', opacity: '0' }, '50%': { transform: 'scale(1.1)' }, '100%': { transform: 'scale(1)', opacity: '1' } }
          },
          boxShadow: { 'glow-primary': '0 0 20px rgba(16, 185, 129, 0.3)', 'medium': '0 4px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 30px -5px rgba(0, 0, 0, 0.08)' }
        }
      }
    }
  </script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/90 dark:bg-dark-surface/90 backdrop-blur-lg border-b border-gray-200 dark:border-dark-border">
    <div class="container mx-auto px-4 py-3">
      <div class="flex items-center justify-between">
        <h1 class="font-display font-bold text-xl text-primary-600 dark:text-primary-400">Meine Farm</h1>
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-1.5 px-3 py-1.5 bg-accent-50 dark:bg-accent-900/20 rounded-full">
            <i data-lucide="dollar-sign" class="w-4 h-4 text-accent-600"></i>
            <span class="font-mono text-sm font-bold text-accent-900 dark:text-accent-100">25,600</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-6 max-w-6xl pb-24 md:pb-6">

    <!-- Stats Overview -->
    <section class="mb-6">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <!-- Active Plants -->
        <div class="bg-white dark:bg-dark-surface border border-gray-200 dark:border-dark-border rounded-xl p-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-primary-100 dark:bg-primary-900/30 rounded-lg flex items-center justify-center">
              <i data-lucide="sprout" class="w-5 h-5 text-primary-600"></i>
            </div>
            <div>
              <div class="text-2xl font-bold text-gray-900 dark:text-white">12</div>
              <div class="text-xs text-gray-600 dark:text-gray-400">Aktive Pflanzen</div>
            </div>
          </div>
        </div>

        <!-- Ready to Harvest -->
        <div class="bg-white dark:bg-dark-surface border border-gray-200 dark:border-dark-border rounded-xl p-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-success-100 dark:bg-success-900/30 rounded-lg flex items-center justify-center">
              <i data-lucide="check-circle" class="w-5 h-5 text-success-600"></i>
            </div>
            <div>
              <div class="text-2xl font-bold text-gray-900 dark:text-white">3</div>
              <div class="text-xs text-gray-600 dark:text-gray-400">Erntebereit</div>
            </div>
          </div>
        </div>

        <!-- Total Yield Today -->
        <div class="bg-white dark:bg-dark-surface border border-gray-200 dark:border-dark-border rounded-xl p-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-accent-100 dark:bg-accent-900/30 rounded-lg flex items-center justify-center">
              <i data-lucide="trending-up" class="w-5 h-5 text-accent-600"></i>
            </div>
            <div>
              <div class="text-2xl font-bold text-gray-900 dark:text-white">850g</div>
              <div class="text-xs text-gray-600 dark:text-gray-400">Heute geerntet</div>
            </div>
          </div>
        </div>

        <!-- Free Slots -->
        <div class="bg-white dark:bg-dark-surface border border-gray-200 dark:border-dark-border rounded-xl p-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gray-100 dark:bg-gray-800 rounded-lg flex items-center justify-center">
              <i data-lucide="grid-3x3" class="w-5 h-5 text-gray-600"></i>
            </div>
            <div>
              <div class="text-2xl font-bold text-gray-900 dark:text-white">8/20</div>
              <div class="text-xs text-gray-600 dark:text-gray-400">Freie Slots</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Farm Grid -->
    <section class="mb-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-display font-bold text-gray-900 dark:text-white">Anbau-Fl‰che</h2>
        <button class="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-semibold rounded-lg transition-colors">
          <div class="flex items-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Neuer Slot</span>
          </div>
        </button>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">

        <!-- Empty Slot -->
        <button class="aspect-square border-2 border-dashed border-gray-300 dark:border-dark-border rounded-2xl flex flex-col items-center justify-center gap-2 text-gray-400 dark:text-gray-600 hover:border-primary-500 hover:text-primary-600 hover:bg-primary-50/50 dark:hover:bg-primary-900/10 transition-all duration-200">
          <i data-lucide="plus" class="w-8 h-8"></i>
          <span class="text-sm font-medium">Slot frei</span>
        </button>

        <!-- Growing Plant -->
        <div class="relative aspect-square bg-gradient-to-br from-primary-50 to-primary-100 dark:from-dark-surface dark:to-dark-elevated border-2 border-primary-200 dark:border-primary-800 rounded-2xl p-4 flex flex-col items-center justify-center animate-pulse-soft">
          <!-- Plant Icon -->
          <div class="w-16 h-16 mb-2">
            <i data-lucide="sprout" class="w-full h-full text-primary-600"></i>
          </div>
          <!-- Plant Name -->
          <span class="text-sm font-semibold text-gray-800 dark:text-white mb-2 text-center">Northern Lights</span>
          <!-- Progress -->
          <div class="w-full">
            <div class="h-2 bg-gray-200 dark:bg-dark-bg rounded-full overflow-hidden mb-1">
              <div class="h-full bg-primary-600 animate-pulse-soft rounded-full" style="width: 45%"></div>
            </div>
            <div class="flex justify-between text-xs">
              <span class="text-gray-500 dark:text-gray-400">1d 8h</span>
              <span class="text-primary-600 font-semibold">45%</span>
            </div>
          </div>
          <!-- Quick Info Button -->
          <button class="absolute top-2 right-2 p-1.5 bg-white/90 dark:bg-dark-surface/90 rounded-lg shadow-sm hover:scale-110 transition-transform">
            <i data-lucide="info" class="w-3 h-3 text-gray-600"></i>
          </button>
        </div>

        <!-- Almost Ready -->
        <div class="relative aspect-square bg-gradient-to-br from-primary-100 to-primary-200 dark:from-primary-900/30 dark:to-primary-800/30 border-2 border-primary-400 dark:border-primary-600 rounded-2xl p-4 flex flex-col items-center justify-center">
          <div class="w-16 h-16 mb-2">
            <i data-lucide="leaf" class="w-full h-full text-primary-700 dark:text-primary-500"></i>
          </div>
          <span class="text-sm font-semibold text-gray-900 dark:text-white mb-2 text-center">Blue Dream</span>
          <div class="w-full">
            <div class="h-2 bg-gray-200 dark:bg-dark-bg rounded-full overflow-hidden mb-1">
              <div class="h-full bg-gradient-to-r from-primary-600 to-primary-700 rounded-full" style="width: 92%"></div>
            </div>
            <div class="flex justify-between text-xs">
              <span class="text-gray-500 dark:text-gray-400">0d 4h</span>
              <span class="text-primary-700 font-bold">92%</span>
            </div>
          </div>
          <button class="absolute top-2 right-2 p-1.5 bg-white/90 dark:bg-dark-surface/90 rounded-lg shadow-sm">
            <i data-lucide="info" class="w-3 h-3 text-gray-600"></i>
          </button>
        </div>

        <!-- Ready to Harvest -->
        <button class="relative aspect-square bg-gradient-to-br from-success-50 to-success-100 dark:from-success-900/20 dark:to-success-800/20 border-2 border-success-400 dark:border-success-600 rounded-2xl p-4 flex flex-col items-center justify-center shadow-glow-primary animate-float hover:scale-105 transition-transform duration-200">
          <!-- Ready Badge -->
          <div class="absolute -top-2 -right-2 px-2 py-1 bg-success-600 text-white text-xs font-bold rounded-full shadow-medium animate-bounce-in">
            Fertig!
          </div>
          <div class="w-16 h-16 mb-2">
            <i data-lucide="leaf" class="w-full h-full text-success-600"></i>
          </div>
          <span class="text-sm font-bold text-success-900 dark:text-success-100 mb-1 text-center">OG Kush</span>
          <span class="text-lg font-mono font-bold text-accent-600">+180g</span>
          <div class="mt-2 px-3 py-1 bg-success-600 text-white text-xs font-bold rounded-full">
            Ernten
          </div>
        </button>

        <!-- Growing Plant 2 -->
        <div class="relative aspect-square bg-gradient-to-br from-primary-50 to-primary-100 dark:from-dark-surface dark:to-dark-elevated border-2 border-primary-200 dark:border-primary-800 rounded-2xl p-4 flex flex-col items-center justify-center">
          <div class="w-16 h-16 mb-2">
            <i data-lucide="sprout" class="w-full h-full text-primary-600"></i>
          </div>
          <span class="text-sm font-semibold text-gray-800 dark:text-white mb-2 text-center">Sour Diesel</span>
          <div class="w-full">
            <div class="h-2 bg-gray-200 dark:bg-dark-bg rounded-full overflow-hidden mb-1">
              <div class="h-full bg-primary-600 rounded-full" style="width: 68%"></div>
            </div>
            <div class="flex justify-between text-xs">
              <span class="text-gray-500 dark:text-gray-400">18h</span>
              <span class="text-primary-600 font-semibold">68%</span>
            </div>
          </div>
          <button class="absolute top-2 right-2 p-1.5 bg-white/90 dark:bg-dark-surface/90 rounded-lg shadow-sm">
            <i data-lucide="info" class="w-3 h-3 text-gray-600"></i>
          </button>
        </div>

        <!-- Ready to Harvest 2 -->
        <button class="relative aspect-square bg-gradient-to-br from-success-50 to-success-100 dark:from-success-900/20 dark:to-success-800/20 border-2 border-success-400 dark:border-success-600 rounded-2xl p-4 flex flex-col items-center justify-center shadow-glow-primary animate-float hover:scale-105 transition-transform duration-200">
          <div class="absolute -top-2 -right-2 px-2 py-1 bg-success-600 text-white text-xs font-bold rounded-full shadow-medium">
            Fertig!
          </div>
          <div class="w-16 h-16 mb-2">
            <i data-lucide="leaf" class="w-full h-full text-success-600"></i>
          </div>
          <span class="text-sm font-bold text-success-900 dark:text-success-100 mb-1 text-center">White Widow</span>
          <span class="text-lg font-mono font-bold text-accent-600">+220g</span>
          <div class="mt-2 px-3 py-1 bg-success-600 text-white text-xs font-bold rounded-full">
            Ernten
          </div>
        </button>

        <!-- Growing Plant 3 -->
        <div class="relative aspect-square bg-gradient-to-br from-primary-50 to-primary-100 dark:from-dark-surface dark:to-dark-elevated border-2 border-primary-200 dark:border-primary-800 rounded-2xl p-4 flex flex-col items-center justify-center animate-pulse-soft">
          <div class="w-16 h-16 mb-2">
            <i data-lucide="sprout" class="w-full h-full text-primary-600"></i>
          </div>
          <span class="text-sm font-semibold text-gray-800 dark:text-white mb-2 text-center">Amnesia Haze</span>
          <div class="w-full">
            <div class="h-2 bg-gray-200 dark:bg-dark-bg rounded-full overflow-hidden mb-1">
              <div class="h-full bg-primary-600 rounded-full" style="width: 28%"></div>
            </div>
            <div class="flex justify-between text-xs">
              <span class="text-gray-500 dark:text-gray-400">2d 6h</span>
              <span class="text-primary-600 font-semibold">28%</span>
            </div>
          </div>
          <button class="absolute top-2 right-2 p-1.5 bg-white/90 dark:bg-dark-surface/90 rounded-lg shadow-sm">
            <i data-lucide="info" class="w-3 h-3 text-gray-600"></i>
          </button>
        </div>

        <!-- Ready to Harvest 3 -->
        <button class="relative aspect-square bg-gradient-to-br from-success-50 to-success-100 dark:from-success-900/20 dark:to-success-800/20 border-2 border-success-400 dark:border-success-600 rounded-2xl p-4 flex flex-col items-center justify-center shadow-glow-primary animate-float hover:scale-105 transition-transform duration-200">
          <div class="absolute -top-2 -right-2 px-2 py-1 bg-success-600 text-white text-xs font-bold rounded-full shadow-medium">
            Fertig!
          </div>
          <div class="w-16 h-16 mb-2">
            <i data-lucide="leaf" class="w-full h-full text-success-600"></i>
          </div>
          <span class="text-sm font-bold text-success-900 dark:text-success-100 mb-1 text-center">AK-47</span>
          <span class="text-lg font-mono font-bold text-accent-600">+195g</span>
          <div class="mt-2 px-3 py-1 bg-success-600 text-white text-xs font-bold rounded-full">
            Ernten
          </div>
        </button>

        <!-- More Empty Slots -->
        <div class="aspect-square border-2 border-dashed border-gray-300 dark:border-dark-border rounded-2xl flex items-center justify-center">
          <i data-lucide="lock" class="w-8 h-8 text-gray-300 dark:text-gray-700"></i>
        </div>

        <div class="aspect-square border-2 border-dashed border-gray-300 dark:border-dark-border rounded-2xl flex items-center justify-center">
          <i data-lucide="lock" class="w-8 h-8 text-gray-300 dark:text-gray-700"></i>
        </div>

      </div>
    </section>

    <!-- Quick Actions -->
    <section class="mb-6">
      <div class="bg-white dark:bg-dark-surface border border-gray-200 dark:border-dark-border rounded-2xl p-6">
        <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-4">Schnellaktionen</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <button class="p-4 border-2 border-gray-200 dark:border-dark-border hover:border-primary-500 hover:bg-primary-50/50 dark:hover:bg-primary-900/10 rounded-xl transition-all duration-200">
            <i data-lucide="zap" class="w-8 h-8 mx-auto mb-2 text-accent-600"></i>
            <div class="text-sm font-semibold text-gray-900 dark:text-white">Alle ernten</div>
          </button>
          <button class="p-4 border-2 border-gray-200 dark:border-dark-border hover:border-primary-500 hover:bg-primary-50/50 dark:hover:bg-primary-900/10 rounded-xl transition-all duration-200">
            <i data-lucide="droplet" class="w-8 h-8 mx-auto mb-2 text-primary-600"></i>
            <div class="text-sm font-semibold text-gray-900 dark:text-white">Alle gieﬂen</div>
          </button>
          <button class="p-4 border-2 border-gray-200 dark:border-dark-border hover:border-primary-500 hover:bg-primary-50/50 dark:hover:bg-primary-900/10 rounded-xl transition-all duration-200">
            <i data-lucide="package" class="w-8 h-8 mx-auto mb-2 text-success-600"></i>
            <div class="text-sm font-semibold text-gray-900 dark:text-white">Verkaufen</div>
          </button>
          <button class="p-4 border-2 border-gray-200 dark:border-dark-border hover:border-primary-500 hover:bg-primary-50/50 dark:hover:bg-primary-900/10 rounded-xl transition-all duration-200">
            <i data-lucide="trending-up" class="w-8 h-8 mx-auto mb-2 text-gray-600"></i>
            <div class="text-sm font-semibold text-gray-900 dark:text-white">Upgrades</div>
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Nav -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-dark-surface border-t border-gray-200 dark:border-dark-border z-50">
    <div class="flex justify-around items-center h-16">
      <a href="#" class="flex flex-col items-center gap-1 text-primary-600 dark:text-primary-400">
        <i data-lucide="home" class="w-6 h-6"></i>
        <span class="text-xs font-medium">Farm</span>
      </a>
      <a href="#" class="flex flex-col items-center gap-1 text-gray-600 dark:text-gray-400">
        <i data-lucide="shopping-cart" class="w-6 h-6"></i>
        <span class="text-xs font-medium">Shop</span>
      </a>
      <a href="#" class="flex flex-col items-center gap-1 text-gray-600 dark:text-gray-400">
        <i data-lucide="trending-up" class="w-6 h-6"></i>
        <span class="text-xs font-medium">Upgrades</span>
      </a>
      <a href="#" class="flex flex-col items-center gap-1 text-gray-600 dark:text-gray-400">
        <i data-lucide="user" class="w-6 h-6"></i>
        <span class="text-xs font-medium">Profil</span>
      </a>
    </div>
  </nav>

  <script>lucide.createIcons();</script>
</body>
</html>
